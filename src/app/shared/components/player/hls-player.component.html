<div class="hls-player-container">
  <!-- Overlay hiển thị khi đang tải -->
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải video...</div>
  </div>

  <!-- Hiển thị lỗi nếu có -->
  <div class="error-message" *ngIf="errorMessage">
    <div class="error-icon">⚠️</div>
    <div class="error-text">{{ errorMessage }}</div>
    <button class="retry-button" (click)="initPlayer()">Thử lại</button>
  </div>

  <!-- Phần tử video -->
  <div id="videoContainer" #videoContainer class="youtube-theme" [ngStyle]="{ 'width.px': width, 'height.px': height }">
    <video #videoPlayer class="video-player" [autoplay]="autoplay" (click)="togglePlayPause()"
      (keydown)="onKeyDown($event)" tabindex="0" playsinline preload="metadata">
    </video>
    
    <!-- Nút play ở giữa -->
    <div class="center-play-button" *ngIf="!isPlaying" (click)="togglePlayPause()" (keydown)="onKeyDown($event)">
      <svg viewBox="0 0 24 24" width="48" height="48">
        <circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.5)" />
        <path d="M8 5.14v14l11-7-11-7z" fill="white" />
      </svg>
    </div>
  </div>

  <!-- Custom controls -->
  <div class="custom-controls" [class.hidden]="isLoading || errorMessage">
    <!-- Progress bar -->
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-buffer" [style.width.%]="bufferPercent"></div>
        <div class="progress-current" [style.width.%]="currentTimePercent"></div>
      </div>
      <input type="range" class="progress-seek" min="0" max="100" step="0.1" [value]="currentTimePercent"
        (input)="onSeekBarChange($event)">
    </div>

    <!-- Control buttons -->
    <div class="controls-buttons">
      <div class="left-controls">
        <!-- Play/Pause button -->
        <button class="control-button" (click)="togglePlayPause()">
          <svg class="control-icon" *ngIf="isPlaying" viewBox="0 0 24 24" width="24" height="24">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" fill="currentColor" />
          </svg>
          <svg class="control-icon" *ngIf="!isPlaying" viewBox="0 0 24 24" width="24" height="24">
            <path d="M8 5.14v14l11-7-11-7z" fill="currentColor" />
          </svg>
        </button>

        <!-- Volume control -->
        <div class="volume-control">
          <button class="control-button" (click)="toggleMute()">
            <svg class="control-icon" *ngIf="!isMuted" viewBox="0 0 24 24" width="24" height="24">
              <path d="M14.016 3.234q3.047 0.656 5.016 3.117t1.969 5.648-1.969 5.648-5.016 3.117v-2.063q2.203-0.656 3.586-2.484t1.383-4.219-1.383-4.219-3.586-2.484v-2.063zM16.5 12q0 2.813-2.484 4.031v-8.063q2.484 1.219 2.484 4.031zM3 9h3.984l5.016-5.016v16.031l-5.016-5.016h-3.984v-6z" fill="currentColor" />
            </svg>
            <svg class="control-icon" *ngIf="isMuted" viewBox="0 0 24 24" width="24" height="24">
              <path d="M12 3.984v4.219l-2.109-2.109zM4.266 3l16.734 16.734-1.266 1.266-2.063-2.063q-1.547 1.313-3.656 1.828v-2.063q1.172-0.328 2.063-1.172l-2.063-2.063v3.469l-5.016-5.016h-3.984v-6h4.734l-4.734-4.734zM18.984 12q0-2.391-1.383-4.219t-3.586-2.484v-2.063q3.047 0.656 5.016 3.117t1.969 5.648q0 2.25-1.031 4.172l-1.5-1.547q0.516-1.266 0.516-2.625zM16.5 12q0 0.422-0.047 0.609l-2.438-2.438v-4.172q2.484 1.219 2.484 4.031z" fill="currentColor" />
            </svg>
          </button>
          <input type="range" class="volume-slider" min="0" max="1" step="0.1" [value]="volume"
            (input)="onVolumeChange($event)">
        </div>

        <!-- Time display -->
        <div class="time-display">
          {{ formatTime(currentTime) }} / {{ formatTime(duration) }}
        </div>
      </div>

      <div class="right-controls">
        <!-- Subtitle controls -->
        <div class="subtitle-control" *ngIf="availableSubtitles.length > 0">
          <button class="control-button" (click)="toggleSubtitleMenu()">
            <svg class="control-icon" viewBox="0 0 24 24" width="24" height="24">
              <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6zm0 4h8v2H6zm10 0h2v2h-2zm-6-4h8v2h-8z" fill="currentColor" />
            </svg>
          </button>
          <div class="subtitle-menu" *ngIf="isSubtitleMenuOpen">
            <div class="subtitle-option">
              <label>
                <input type="checkbox" [checked]="subtitlesEnabled" (change)="toggleSubtitles()">
                Bật phụ đề
              </label>
            </div>
            <div class="subtitle-option" *ngFor="let subtitle of availableSubtitles">
              <label>
                <input type="radio" name="subtitle" [value]="subtitle.id" [checked]="selectedSubtitle === subtitle.id"
                  (change)="selectSubtitle(subtitle.id)">
                {{ subtitle.label }}
              </label>
            </div>
          </div>
        </div>

        <!-- Quality selector (Settings icon) -->
        <div class="quality-control">
          <button class="control-button" (click)="toggleQualityMenu()">
            <svg class="control-icon" viewBox="0 0 24 24" width="24" height="24">
              <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" fill="white" />
            </svg>
          </button>
          <div class="quality-menu" *ngIf="isQualityMenuOpen">
            <div class="quality-option">
              <label>
                <input type="radio" name="quality" value="auto" [checked]="selectedQuality === 'auto'"
                  (change)="onQualityChange('auto')">
                Tự động
              </label>
            </div>
            <div class="quality-option" *ngFor="let quality of availableQualities">
              <label>
                <input type="radio" name="quality" [value]="quality" [checked]="selectedQuality === quality"
                  (change)="onQualityChange(quality)">
                {{ quality }}
              </label>
            </div>
          </div>
        </div>

        <!-- PiP button -->
        <button class="control-button" (click)="togglePictureInPicture()">
          <svg class="control-icon" viewBox="0 0 24 24" width="24" height="24">
            <path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 1.98 2 1.98h18c1.1 0 2-.88 2-1.98V5c0-1.1-.9-2-2-2zm0 16.01H3V4.98h18v14.03z" fill="currentColor" />
          </svg>
        </button>

        <!-- Fullscreen button -->
        <button class="control-button" (click)="toggleFullscreen()">
          <svg class="control-icon" *ngIf="!isFullscreen" viewBox="0 0 24 24" width="24" height="24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" fill="currentColor" />
          </svg>
          <svg class="control-icon" *ngIf="isFullscreen" viewBox="0 0 24 24" width="24" height="24">
            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="app_main">
  <div class="grid wide container">
    <div class="row main_container">
      <div
        class="col c-6 m-3 l-2 moviesposter-wrapper"
        *ngFor="let movie of movies"
      >
        <a [routerLink]="['/phim', movie.slug]">
          <img [src]="movie.thumb_url" [alt]="movie.name" />
        </a>
        <h3 class="moviesposter-title">{{ movie.name }}</h3>
        <div class="moviesposter-practice">{{ movie.current_episode }}</div>
        <div class="moviesposter-HD">{{ movie.quality }}</div>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <nav aria-label="Page navigation">
    <ul class="pagination mb-0">
      <li class="page-item" [class.disabled]="page === 1">
        <a class="page-link" (click)="onPageChange(page-1)" aria-label="Previous">
          <span aria-hidden="true">&laquo;</span>
        </a>
      </li>
      <li class="page-item" *ngFor="let pageNum of getPageArray()" [class.active]="pageNum === page">
        <a class="page-link" (click)="onPageChange(pageNum)">{{ pageNum }}</a>
      </li>
      <li class="page-item" [class.disabled]="page === totalPages">
        <a class="page-link" (click)="onPageChange(page+1)" aria-label="Next">
          <span aria-hidden="true">&raquo;</span>
        </a>
      </li>
    </ul>
  </nav>
</div>

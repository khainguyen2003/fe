<div class="card">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">{{ isEditMode ? 'Chỉnh sửa phim' : 'Thêm phim mới' }}</h5>
    </div>
    <div class="card-body">
        <form [formGroup]="movieForm" (ngSubmit)="onSubmit()">
            <div class="row">
                <!-- Thông tin cơ bản -->
                <div class="col-md-8">
                    <div class="card mb-3">
                        <div class="card-header bg-light">
                            <h6 class="mb-0">Thông tin cơ bản</h6>
                        </div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Tên phim <span
                                            class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" formControlName="name"
                                        [ngClass]="{'is-invalid': formControls['name'].touched && formControls['name'].invalid}">
                                    <div class="invalid-feedback" *ngIf="formControls['name'].errors?.['required']">
                                        Vui lòng nhập tên phim
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="originalName" class="form-label">Tên gốc <span
                                            class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="originalName"
                                        formControlName="originalName"
                                        [ngClass]="{'is-invalid': formControls['originalName'].touched && formControls['originalName'].invalid}">
                                    <div class="invalid-feedback"
                                        *ngIf="formControls['originalName'].errors?.['required']">
                                        Vui lòng nhập tên gốc của phim
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Mô tả</label>
                                <textarea class="form-control" id="description" rows="4"
                                    formControlName="description"></textarea>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="type" class="form-label">Loại phim <span
                                            class="text-danger">*</span></label>
                                    <select class="form-select" id="type" formControlName="type">
                                        <option *ngFor="let type of movieTypes" [value]="type.value">{{ type.label }}
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="status" class="form-label">Trạng thái</label>
                                    <select class="form-select" id="status" formControlName="status">
                                        <option *ngFor="let status of movieStatuses" [value]="status.value">{{
                                            status.label }}</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-3" *ngIf="isMovieSeries">
                                <div class="col-md-6">
                                    <label for="totalEpisodes" class="form-label">Tổng số tập</label>
                                    <input type="number" class="form-control" id="totalEpisodes"
                                        formControlName="totalEpisodes" min="1">
                                </div>
                                <div class="col-md-6">
                                    <label for="currentEpisode" class="form-label">Tập hiện tại</label>
                                    <input type="text" class="form-control" id="currentEpisode"
                                        formControlName="currentEpisode">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="time" class="form-label">Thời lượng</label>
                                    <input type="text" class="form-control" id="time" formControlName="time"
                                        placeholder="VD: 120 phút">
                                </div>
                                <div class="col-md-6">
                                    <label for="quality" class="form-label">Chất lượng</label>
                                    <input type="text" class="form-control" id="quality" formControlName="quality"
                                        placeholder="VD: HD, FullHD, 4K...">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="language" class="form-label">Ngôn ngữ</label>
                                    <input type="text" class="form-control" id="language" formControlName="language"
                                        placeholder="VD: Vietsub, Thuyết minh...">
                                </div>
                                <div class="col-md-6">
                                    <label for="director" class="form-label">Đạo diễn</label>
                                    <input type="text" class="form-control" id="director" formControlName="director">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="casts" class="form-label">Diễn viên</label>
                                <input type="text" class="form-control" id="casts" formControlName="casts"
                                    placeholder="VD: Diễn viên A, Diễn viên B...">
                            </div>

                            <div class="mb-3">
                                <label for="genreIds" class="form-label">Thể loại</label>
                                <ng-select [items]="genreOptions" bindLabel="label" bindValue="value" [multiple]="true"
                                    placeholder="Chọn thể loại" formControlName="genreIds">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Hình ảnh -->
                <div class="col-md-4">
                    <div class="card mb-3">
                        <div class="card-header bg-light">
                            <h6 class="mb-0">Hình ảnh</h6>
                        </div>
                        <div class="card-body">
                            <!-- Thumbnail -->
                            <div class="mb-4">
                                <label class="form-label">Ảnh thumbnail</label>
                                <div class="d-flex flex-column align-items-center">
                                    <div class="image-preview mb-2" *ngIf="thumbPreviewUrl">
                                        <img [src]="thumbPreviewUrl" alt="Thumbnail preview" class="img-thumbnail"
                                            style="max-height: 150px;">
                                    </div>
                                    <div class="empty-image d-flex justify-content-center align-items-center border rounded p-3 mb-2"
                                        *ngIf="!thumbPreviewUrl" style="height: 150px; width: 100%;">
                                        <div class="text-center text-muted">
                                            <i class="bi bi-image fs-2"></i>
                                            <p class="mb-0">Chưa có ảnh thumbnail</p>
                                        </div>
                                    </div>
                                    <div class="mt-2">
                                        <input type="file" class="form-control" id="thumbImage" accept="image/*"
                                            (change)="onThumbImageChange($event)">
                                    </div>
                                </div>
                            </div>

                            <!-- Poster -->
                            <div>
                                <label class="form-label">Ảnh poster</label>
                                <div class="d-flex flex-column align-items-center">
                                    <div class="image-preview mb-2" *ngIf="posterPreviewUrl">
                                        <img [src]="posterPreviewUrl" alt="Poster preview" class="img-thumbnail"
                                            style="max-height: 200px;">
                                    </div>
                                    <div class="empty-image d-flex justify-content-center align-items-center border rounded p-3 mb-2"
                                        *ngIf="!posterPreviewUrl" style="height: 200px; width: 100%;">
                                        <div class="text-center text-muted">
                                            <i class="bi bi-image fs-2"></i>
                                            <p class="mb-0">Chưa có ảnh poster</p>
                                        </div>
                                    </div>
                                    <div class="mt-2">
                                        <input type="file" class="form-control" id="posterImage" accept="image/*"
                                            (change)="onPosterImageChange($event)">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <!-- Thêm nút Cancel và Save vào cuối component HTML (nếu chưa có) -->
            <div class="d-flex justify-content-end mt-4">
                <button type="button" class="btn btn-secondary me-2" (click)="onCancel()">Hủy</button>
                <button type="button" class="btn btn-primary" [disabled]="movieForm.invalid || isSubmitting"
                    (click)="onSubmit()">
                    {{ isEditMode ? 'Cập nhật' : 'Thêm mới' }}
                    <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm ms-1" role="status"
                        aria-hidden="true"></span>
                </button>
            </div>
        </form>
    </div>
</div>

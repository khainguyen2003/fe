<div class="d-flex">
  <!-- Sidebar -->
  <div class="sidebar bg-dark text-white" [class.collapsed]="!isSidebarExpanded">
    <div class="sidebar-header p-3 d-flex justify-content-between align-items-center">
      <div class="logo d-flex align-items-center">
        <img src="assets/img/logo.png" alt="MotChill" width="40" height="40" class="me-2">
        <span class="logo-text" *ngIf="isSidebarExpanded">MotChill Admin</span>
      </div>
      <button class="btn btn-sm btn-outline-light d-lg-none" (click)="toggleSidebar()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    
    <div class="sidebar-content">
      <ul class="nav flex-column">
        <li class="nav-item" *ngFor="let item of menuItems">
          <a class="nav-link text-white" [routerLink]="[item.link]" routerLinkActive="active">
            <i [class]="item.icon + ' me-3'"></i>
            <span *ngIf="isSidebarExpanded">{{ item.title }}</span>
          </a>
        </li>
      </ul>
    </div>
    
    <div class="sidebar-footer mt-auto p-3 border-top border-secondary" *ngIf="isSidebarExpanded">
      <div class="d-flex align-items-center">
        <img [src]="userInfo.avatar" alt="User" class="rounded-circle me-2" width="36" height="36">
        <div>
          <div class="fw-bold">{{ userInfo.name }}</div>
          <small class="text-muted">{{ userInfo.email }}</small>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Main Content -->
  <div class="main-content">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
      <div class="container-fluid">
        <button class="btn btn-sm btn-outline-secondary d-lg-none me-2" (click)="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
        
        <div class="ms-auto d-flex align-items-center">
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown">
              <i class="bi bi-bell me-1"></i>
              <span class="badge bg-danger rounded-pill">5</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
              <li><h6 class="dropdown-header">Thông báo</h6></li>
              <li><a class="dropdown-item" href="#">Có 3 phim mới được thêm vào</a></li>
              <li><a class="dropdown-item" href="#">2 người dùng đã đăng ký mới</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-primary" href="#">Xem tất cả thông báo</a></li>
            </ul>
          </div>
          
          <div class="dropdown ms-3">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center" type="button" id="userDropdown" data-bs-toggle="dropdown">
              <img [src]="userInfo.avatar" alt="User" class="rounded-circle me-2" width="24" height="24">
              <span>{{ userInfo.name }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
              <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Hồ sơ</a></li>
              <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Cài đặt</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    
    <!-- Content Area -->
    <div class="content p-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

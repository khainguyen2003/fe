<div class="admin-container">
  <!-- Sidebar -->
  <div class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo-container">
        <img src="assets/images/logo.png" alt="MotChill Logo" class="logo" />
        <h5 *ngIf="!isSidebarCollapsed" class="logo-text">MotChill Admin</h5>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <i class="bi" [ngClass]="isSidebarCollapsed ? 'bi-arrow-right-square' : 'bi-arrow-left-square'"></i>
      </button>
    </div>
    
    <div class="sidebar-menu">
      <ul class="nav flex-column">
        <li class="nav-item" *ngFor="let item of menuItems">
          <a 
            [routerLink]="item.route" 
            [class.active]="item.active"
            class="nav-link" 
            (click)="setActiveMenuItem(item)">
            <i [class]="item.icon"></i>
            <span *ngIf="!isSidebarCollapsed">{{ item.title }}</span>
          </a>
        </li>
      </ul>
    </div>
    
    <div class="sidebar-footer" *ngIf="!isSidebarCollapsed">
      <div class="version">
        <small>Version 1.0.0</small>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" [class.expanded]="isSidebarCollapsed">
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
      <div class="container-fluid">
        <div class="d-flex align-items-center">
          <h5 class="mb-0">Quản Trị Hệ Thống</h5>
        </div>
        
        <div class="dropdown ms-auto">
          <button class="btn btn-outline-primary dropdown-toggle d-flex align-items-center" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle me-2"></i>
            <span>{{ username }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Thông tin cá nhân</a></li>
            <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Cài đặt</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page Content -->
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-6">
            <p class="mb-0">© {{ currentYear }} MotChill. Tất cả quyền được bảo lưu.</p>
          </div>
          <div class="col-md-6 text-md-end">
            <p class="mb-0">Phát triển bởi <a href="#" class="text-primary">Nguyễn Văn Khải</a></p>
          </div>
        </div>
      </div>
    </footer>
  </div>
</div>
